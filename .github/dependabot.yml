version: 2
updates:
  # GitHub Actions only.
  #
  # Actions in this fork's own workflows are SHA-pinned, so without dependabot
  # they silently rot. This keeps those pins current.
  #
  # The Python (`pip`) ecosystem is deliberately NOT enabled here, unlike
  # upstream. This fork is "upstream vLLM + a FIPS-safe OpenCV wheel"; letting
  # dependabot bump vLLM's Python dependencies independently would diverge the
  # dependency tree from the upstream release this fork is based on, which is
  # exactly what makes a fork expensive to maintain. Dependency updates should
  # arrive by rebasing onto a newer upstream tag instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
