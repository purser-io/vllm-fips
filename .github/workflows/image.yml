# Build, verify, and scan the FIPS-hardened vLLM container image.
#
# This is the artifact where the FIPS guarantee actually lives. The wheel
# workflow proves the OpenCV build is sound; this proves the image that
# consumes it is, by exercising the two runtime gates in docker/Dockerfile
# (in the `vllm-base` and `test` stages) which no other job reaches.
#
# Kernel compilation is skipped via VLLM_USE_PRECOMPILED. Compiling vLLM's
# CUDA kernels across every supported arch takes hours and does not fit a
# hosted runner; the precompiled wheel for the base commit is published by
# upstream and is what `docker/Dockerfile` already uses in its `build` stage.
# A GPU is NOT required to build -- only to run.
#
# Registry: GHCR by default, because GITHUB_TOKEN already authenticates to it.
# To publish to Google Artifact Registry instead, set the repository variables
# GAR_LOCATION / GAR_PROJECT / GAR_REPOSITORY and the secret GCP_WIF_PROVIDER +
# variable GCP_SERVICE_ACCOUNT; the `Push to Artifact Registry` step below
# activates on their presence. Keyless via Workload Identity Federation -- do
# not add a JSON service-account key.
name: Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to the registry"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build + verify + scan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write         # GHCR
      id-token: write         # WIF, if Artifact Registry is configured
      security-events: write  # SARIF upload
    steps:
      # A hosted runner has ~14 GB free; the CUDA devel base alone is ~6 GB and
      # the final image is far larger. Without this the build dies partway
      # through with an opaque ENOSPC.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the base-commit resolution below uses
          # `git describe`, which finds nothing in a shallow checkout.
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The image build requires the FIPS wheel in custom-wheels/ and fails
      # fast without it. Built here rather than downloaded so this workflow has
      # no ordering dependency on a wheel run having happened first.
      - name: Build FIPS OpenCV wheel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.opencv-fips
          platforms: linux/amd64
          target: export
          outputs: type=local,dest=custom-wheels
          cache-from: type=gha,scope=opencv-fips-x86_64
          cache-to: type=gha,mode=max,ignore-error=true,scope=opencv-fips-x86_64

      # Must be the UPSTREAM commit this fork is based on, not our HEAD.
      # Upstream publishes precompiled wheels keyed by their own commits;
      # passing a fork commit yields a 404 from wheels.vllm.ai and the build
      # falls through to compiling kernels, which does not fit a hosted runner.
      #
      # Derived from the most recent plain upstream release tag, excluding this
      # fork's `+fips` tags, so it keeps working across rebases onto newer
      # upstream releases.
      - name: Resolve upstream base commit
        id: base
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 \
                   --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*fips*' HEAD)"
          sha="$(git rev-list -1 "$tag")"
          echo "base tag: $tag  sha: $sha"

          # Fail loudly here rather than 20 minutes into the image build.
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
                    "https://wheels.vllm.ai/${sha}/cu130/" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::No cu130 precompiled wheels for ${tag} (${sha}): HTTP ${code}."
            echo "::error::Upstream may have pruned them, or this fork is based on a commit that never had them."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Reaching `vllm-openai` runs the FIPS gate in `vllm-base`: no bundled
      # OpenSSL, FFmpeg present, a usable stream-buffered backend, and the
      # expected +fips distribution version. A green build IS that gate
      # passing -- it is a RUN step, not an advisory check.
      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          target: vllm-openai
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VLLM_USE_PRECOMPILED=1
            VLLM_MERGE_BASE_COMMIT=${{ steps.base.outputs.sha }}
            torch_cuda_arch_list=9.0
            RUN_WHEEL_CHECK=false
          cache-from: type=gha,scope=vllm-image-x86_64
          cache-to: type=gha,mode=max,ignore-error=true,scope=vllm-image-x86_64

      # Re-assert inside the finished image. The in-build gate can only fail
      # the layer that runs it; this proves the property holds in the artifact
      # that actually ships.
      - name: Verify FIPS properties in the built image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tools:/t:ro" --entrypoint python3 \
            "${IMAGE}:ci" /t/check_opencv_fips.py \
              --require-ffmpeg --expect-version 4.13.0.92+fips

      - name: Trivy scan image (report to code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: sarif
          output: trivy-image.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-vllm-image

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: cyclonedx
          output: sbom-vllm-image.cdx.json
          scanners: vuln

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-vllm-image
          path: sbom-vllm-image.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Gate on OS packages only, for the same reason as the wheel workflow:
      # the image carries build/runtime Python tooling whose CVEs are not
      # actionable here, and a permanently red gate is an ignored gate.
      # Runs before any push so a vulnerable image is never published.
      - name: Fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          vuln-type: os

      - name: Log in to GHCR
        if: github.event_name == 'release' || inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'release' || inputs.push
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          docker tag "${IMAGE}:ci" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
          echo "pushed ${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # Optional Artifact Registry publication. Inert until the repository
      # variables below are set, so it cannot fail a run that has not opted in.
      - name: Authenticate to Google Cloud
        id: gcp
        if: >-
          (github.event_name == 'release' || inputs.push)
          && vars.GAR_LOCATION != '' && vars.GAR_PROJECT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Push to Artifact Registry
        if: steps.gcp.outcome == 'success'
        run: |
          set -euo pipefail
          HOST="${{ vars.GAR_LOCATION }}-docker.pkg.dev"
          DEST="${HOST}/${{ vars.GAR_PROJECT }}/${{ vars.GAR_REPOSITORY }}/vllm-fips"
          TAG="${GITHUB_REF_NAME:-sha-$(git rev-parse --short HEAD)}"
          gcloud auth configure-docker "$HOST" --quiet
          docker tag "${IMAGE}:ci" "${DEST}:${TAG}"
          docker push "${DEST}:${TAG}"
          echo "pushed ${DEST}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
