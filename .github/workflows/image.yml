# Build, verify, and scan the FIPS-hardened vLLM container image.
#
# This is the artifact where the FIPS guarantee actually lives. Reaching
# `vllm-openai` runs the two runtime gates in docker/Dockerfile (vllm-base and
# test) that no other job reaches.
#
# Kernel compilation is skipped via VLLM_USE_PRECOMPILED; upstream publishes a
# precompiled wheel for this fork's base commit. A GPU is NOT required to
# build, only to run.
#
# PERFORMANCE NOTES (a cold build was 50 min; these are why it is not):
#
#   * Registry cache, not GHA cache. GitHub caps Actions cache at 10 GB per
#     repository. This image's layers alone are ~8.4 GB and `mode=max` also
#     caches intermediate stages, so the repo sat at 16 GB and GitHub evicted
#     LRU entries continuously -- every run hit "blob ... not found" on restore
#     and rebuilt the whole graph from scratch. GHCR has no such cap.
#   * Scan once, convert. Trivy was analysing the same 8.4 GB image three times
#     (SARIF, SBOM, gate) at ~4 min each. It now analyses once to JSON and
#     derives the rest with `trivy convert`, which re-reads the report instead
#     of the image.
#   * The Wolfi job `needs: image` rather than running in parallel: it shares
#     every stage up to vllm-base, so once the first job has populated the
#     registry cache it only has to build its own final stage.
#   * The disk-cleanup step stays. It looks like dead weight at 1.3 min, but
#     the runner starts at ~87 GB and it recovers ~24 GB that the export phase
#     genuinely needs; removing it produced ENOSPC on libnvrtc.
#
# Measured after these changes: Build image 35.9 min, single Trivy pass 4.8
# min, ~42 min total (was ~61). The residual is dominated by work a layer
# cache cannot help with -- rust-build 9.4 min and extensions-build 5.5 min
# both use `--mount=type=cache`, which is builder-local and never persisted by
# a registry cache export, plus ~9.4 min of layer export and tarball load
# inherent to producing an 8.4 GB image with `load: true`.
name: Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to the registry"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}:buildcache

jobs:
  image:
    name: build + verify + scan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      # Load-bearing, despite appearances. The runner starts with ~87 GB free
      # and this recovers ~24 GB. Removing it once on the assumption that 87 GB
      # was plenty produced:
      #   write /usr/local/cuda-13.0/.../libnvrtc.alt.so.13.0.88:
      #   no space left on device
      # during the export/import phase, where the image exists twice at once
      # (buildkit's copy plus the daemon's, on top of the pulled registry
      # cache). Check the reported margin below before trimming this again.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the base resolution below uses git describe.
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Before the build: the registry cache is read and written through this.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must be the UPSTREAM commit this fork is based on, not our HEAD:
      # upstream publishes precompiled wheels keyed by their own commits, and a
      # fork commit 404s, silently falling back to a multi-hour kernel compile.
      - name: Resolve upstream base commit
        id: base
        run: |
          set -euo pipefail
          if ! tag="$(git describe --tags --abbrev=0 \
                        --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*fips*' \
                        HEAD 2>/dev/null)"; then
            echo "::error::No upstream release tag reachable from HEAD."
            echo "::error::This fork must carry the upstream tag it is based on:"
            echo "::error::  git push origin refs/tags/vX.Y.Z"
            exit 1
          fi
          sha="$(git rev-list -1 "$tag")"
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
                    "https://wheels.vllm.ai/${sha}/cu130/" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::No cu130 precompiled wheels for ${tag} (${sha}): HTTP ${code}."
            exit 1
          fi
          echo "base tag: $tag  sha: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build FIPS OpenCV wheel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.opencv-fips
          platforms: linux/amd64
          target: export
          outputs: type=local,dest=custom-wheels
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-opencv
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-opencv,mode=max,ignore-error=true

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          target: vllm-openai
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VLLM_USE_PRECOMPILED=1
            VLLM_MERGE_BASE_COMMIT=${{ steps.base.outputs.sha }}
            torch_cuda_arch_list=9.0
            RUN_WHEEL_CHECK=false
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max,ignore-error=true

      # Record the margin so the disk headroom is a measured number rather
      # than an assumption the next time someone trims the cleanup step.
      - name: Report disk headroom
        if: always()
        run: |
          echo "free after image build: $(df -h / | awk 'NR==2{print $4}')" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify FIPS properties in the built image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tools:/t:ro" --entrypoint python3 \
            "${IMAGE}:ci" /t/check_opencv_fips.py \
              --require-ffmpeg --expect-version 4.13.0.92+fips

      # One analysis of the image; everything else is derived from the report.
      - name: Scan image (single pass)
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/w" -w /w \
            aquasec/trivy:latest image \
              --scanners vuln --list-all-pkgs \
              --format json --output trivy.json \
              "${IMAGE}:ci"
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:latest \
            convert --format sarif --output trivy.sarif trivy.json
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:latest \
            convert --format cyclonedx --output sbom-vllm-image.cdx.json trivy.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy.sarif
          category: trivy-vllm-image

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-vllm-image
          path: sbom-vllm-image.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Gate read from the report above rather than re-scanning. OS packages
      # only: the image carries Python tooling whose CVEs are not actionable
      # here, and a permanently red gate is an ignored gate.
      - name: Fail on fixable HIGH/CRITICAL (OS packages)
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          d = json.loads(pathlib.Path("trivy.json").read_text())
          bad = [
              v for r in (d.get("Results") or [])
              if r.get("Class") == "os-pkgs"
              for v in (r.get("Vulnerabilities") or [])
              if v.get("Severity") in ("HIGH", "CRITICAL")
              and v.get("FixedVersion")
          ]
          for v in bad:
              print(f"  {v['VulnerabilityID']}  {v['PkgName']} "
                    f"{v.get('InstalledVersion')} -> {v.get('FixedVersion')}  "
                    f"{v['Severity']}")
          print(f"fixable HIGH/CRITICAL in OS packages: {len(bad)}")
          sys.exit(1 if bad else 0)
          PY

      # Published unconditionally so the Wolfi job can COPY --from this
      # reference instead of rebuilding base -> csrc-build -> build ->
      # vllm-base just to have a source. That rebuild is ~50 GB of
      # intermediate stages and is what exhausted the runner's disk.
      - name: Publish runtime image for the Wolfi job
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:ci" "${IMAGE}:ci-runtime-${GITHUB_RUN_ID}"
          docker push -q "${IMAGE}:ci-runtime-${GITHUB_RUN_ID}"
          echo "runtime source: ${IMAGE}:ci-runtime-${GITHUB_RUN_ID}"

      - name: Push to GHCR
        if: github.event_name == 'release' || inputs.push
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          docker tag "${IMAGE}:ci" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
          echo "pushed \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        id: gcp
        if: >-
          (github.event_name == 'release' || inputs.push)
          && vars.GAR_LOCATION != '' && vars.GAR_PROJECT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Push to Artifact Registry
        if: steps.gcp.outcome == 'success'
        run: |
          set -euo pipefail
          HOST="${{ vars.GAR_LOCATION }}-docker.pkg.dev"
          DEST="${HOST}/${{ vars.GAR_PROJECT }}/${{ vars.GAR_REPOSITORY }}/vllm-fips"
          TAG="${GITHUB_REF_NAME:-sha-$(git rev-parse --short HEAD)}"
          gcloud auth configure-docker "$HOST" --quiet
          docker tag "${IMAGE}:ci" "${DEST}:${TAG}"
          docker push "${DEST}:${TAG}"
          echo "pushed \`${DEST}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  # Opt-in Wolfi variant. `needs: image` so the registry cache is already warm:
  # it shares every stage up to vllm-base and only builds its own final stage.
  # Non-blocking -- unvalidated on GPU hardware, and must not be able to fail a
  # run that publishes the supported image.
  wolfi:
    name: wolfi variant (opt-in)
    needs: image
    if: always() && needs.image.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      # Same reason as the image job: the runner starts at ~87 GB and this
      # recovers ~24 GB. Omitting it here (it was only restored in the image
      # job) is what killed the first Wolfi run -- 23 min in, the log simply
      # stopped with no error, which is what running out of room looks like.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wolfi variant
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          target: vllm-openai-wolfi
          # Loadable again now that VLLM_RUNTIME_SRC points at a published
          # image: this job pulls ~8.4 GB and writes ~8 GB instead of
          # rebuilding ~50 GB of intermediate stages to have a COPY source.
          load: true
          tags: ${{ env.IMAGE }}:ci-wolfi
          build-args: |
            VLLM_USE_PRECOMPILED=1
            VLLM_MERGE_BASE_COMMIT=${{ needs.image.outputs.base_sha }}
            torch_cuda_arch_list=9.0
            RUN_WHEEL_CHECK=false
            VLLM_RUNTIME_SRC=ghcr.io/${{ github.repository }}:ci-runtime-${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }}-wolfi,mode=max,ignore-error=true

      - name: Report disk headroom
        if: always()
        run: |
          echo "free after wolfi build - $(df -h / | awk 'NR==2{print $4}')"

      # The claim behind this variant is fewer CVEs. Measure it: scan both the
      # published Ubuntu runtime image and the Wolfi one, OS packages only.
      - name: Compare CVE counts (Ubuntu vs Wolfi)
        run: |
          set -uo pipefail
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/w" -w /w aquasec/trivy:latest image --quiet \
              --scanners vuln --format json --output "$2" "$1" || true
          }
          scan "ghcr.io/${{ github.repository }}:ci-runtime-${{ github.run_id }}" ubuntu.json
          scan "${IMAGE}:ci-wolfi" wolfi.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          def tally(p):
              f = pathlib.Path(p)
              if not f.exists(): return None
              c = collections.Counter()
              for r in (json.loads(f.read_text()).get("Results") or []):
                  if r.get("Class") != "os-pkgs": continue
                  for v in (r.get("Vulnerabilities") or []):
                      c[v.get("Severity", "UNKNOWN")] += 1
              return c
          u, w = tally("ubuntu.json"), tally("wolfi.json")
          print("### OS-package CVEs: Ubuntu vs Wolfi final image\n")
          if u is None or w is None:
              print("One or both scans produced no parseable output.")
          else:
              print("| Severity | Ubuntu | Wolfi | Delta |")
              print("| --- | --- | --- | --- |")
              for s in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]:
                  a, b = u.get(s, 0), w.get(s, 0)
                  print(f"| {s} | {a} | {b} | {b-a:+d} |")
              ta, tb = sum(u.values()), sum(w.values())
              print(f"| **Total** | **{ta}** | **{tb}** | **{tb-ta:+d}** |")
          PY
