# Multi-platform build of the FIPS-safe `opencv-python-headless` wheel.
#
# Maintained by Purser in purser-io/vllm-fips. The wheels and SHA256SUMS this
# workflow publishes are the canonical artifacts; consume them with
#   gh run download --repo purser-io/vllm-fips --name opencv-fips-wheels
# The underlying diagnosis and upstream fixes are the OpenCV community's work
# (opencv-python#1184/#1191, #1190/#1224) and are credited in
# docker/Dockerfile.opencv-fips and docs/usage/security.md.
#
# The published PyPI wheels bundle their own OpenSSL inside a vendored FFmpeg.
# On a FIPS-enabled host that non-validated OpenSSL fails its self-test during
# dlopen and aborts the process on `import cv2` (exit 134). The upstream fixes
# (opencv/opencv-python#1190, #1224) are still open, so we build our own.
# See custom-wheels/README.md for the full rationale.
#
# Each architecture builds on a NATIVE runner. Cross-building OpenCV + FFmpeg
# under QEMU works but is slow enough (hours) to be impractical in CI.
#
# `ubuntu-24.04-arm` is a GitHub-hosted arm64 runner: free for public repos,
# and available on Team/Enterprise plans for private ones. If it is not
# available to this repo, drop the arm64 matrix entry and build that wheel on
# a self-hosted arm64 runner -- do not silently fall back to QEMU.
name: OpenCV FIPS wheel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/Dockerfile.opencv-fips
      - tools/check_opencv_fips.py
      - .github/workflows/opencv-fips-wheel.yml
  push:
    branches: [main]
    paths:
      - docker/Dockerfile.opencv-fips
      - tools/check_opencv_fips.py
      - .github/workflows/opencv-fips-wheel.yml
  # Deliberately the `release` event rather than a `tags:` push filter: GitHub
  # ANDs `paths` with `tags`, so a tag push that touches none of the paths
  # above would never trigger this workflow -- and a release tag almost never
  # touches them. `paths` does not apply to `release`, so this always fires.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # OpenCV + FFmpeg from source; well under this on a warm cache.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # registry build cache lives in GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `export` target is a FROM scratch stage holding only the wheel, so
      # type=local writes the wheel straight into ./wheelhouse. Reaching it
      # forces the builder stage to complete, which includes the in-build
      # assertions (FFmpeg not linked to OpenSSL; no OpenSSL in the repaired
      # wheel; gate script passes).
      - name: Build wheel (${{ matrix.platform }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.opencv-fips
          platforms: ${{ matrix.platform }}
          target: export
          outputs: type=local,dest=wheelhouse
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-opencv-${{ matrix.arch }}
          # ignore-error: a cache-export blip must not fail a build whose
          # layers all completed. The cache is an optimization, not a gate.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-opencv-${{ matrix.arch }},mode=max,ignore-error=true

      # Guards against the easiest mistake here: producing a wheel for the
      # wrong architecture. A mismatched wheel does not fail the image build
      # loudly -- it fails later at dependency resolution, which reads as a
      # missing package rather than an arch mixup.
      - name: Assert wheel architecture
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::expected exactly 1 wheel, got ${#wheels[@]}: ${wheels[*]:-none}"
            exit 1
          fi
          name="$(basename "${wheels[0]}")"
          echo "built: $name"
          if [[ "$name" != *"${{ matrix.arch }}"* ]]; then
            echo "::error::wheel $name does not target ${{ matrix.arch }}"
            exit 1
          fi

      # The Dockerfile gates the wheel inside the build stage; this re-runs the
      # gate against the *exported artifact* in a clean interpreter, which is
      # what downstream images actually install.
      - name: Verify exported wheel is FIPS-safe and has FFmpeg
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim bash -euc '
            pip install --quiet --no-cache-dir wheelhouse/*.whl
            python tools/check_opencv_fips.py --require-ffmpeg
          '

      - name: Record checksum
        run: |
          set -euo pipefail
          cd wheelhouse
          sha256sum ./*.whl | tee "SHA256SUMS.${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencv-fips-wheel-${{ matrix.arch }}
          path: |
            wheelhouse/*.whl
            wheelhouse/SHA256SUMS.*
          if-no-files-found: error
          retention-days: 90

  scan:
    name: CVE scan (bundled libraries)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read           # read the registry build cache
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # auditwheel vendors ~17 native libraries into the wheel (libtiff,
      # libwebp, libpng, libopenjp2, libavcodec, ...). Once vendored they carry
      # no package metadata, so neither Dependabot nor a scan of the wheel
      # itself can attribute a CVE to them. The builder image still has them as
      # dpkg entries with exact versions, so scanning it is what actually
      # surfaces vulnerabilities in the code we ship inside the wheel.
      #
      # x86_64 only: the bundled libraries come from the same Ubuntu 22.04
      # package set on both arches, so the aarch64 leg would report the same
      # CVEs. Noted explicitly rather than left as a silent gap.
      - name: Build builder stage for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.opencv-fips
          platforms: linux/amd64
          target: builder
          load: true
          tags: opencv-fips-builder:scan
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-opencv-x86_64

      # Report everything, always. This uploads to code scanning rather than
      # failing the job, so the findings are visible and triageable.
      - name: Trivy scan (report to code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencv-fips-builder:scan
          format: sarif
          output: trivy.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy.sarif
          category: trivy-opencv-fips-builder

      # SBOM of what the wheel actually vendors, retained alongside the wheels.
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencv-fips-builder:scan
          format: cyclonedx
          output: sbom-opencv-fips.cdx.json
          scanners: vuln

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-opencv-fips
          path: sbom-opencv-fips.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Gate last, so the SARIF and SBOM are always published even when this
      # fails.
      #
      # vuln-type: os -- gate on OS packages only. Those are the libraries
      # auditwheel vendors into the wheel, i.e. code we actually ship. The
      # builder also carries Python build tooling (pip, setuptools, wheel,
      # scikit-build, auditwheel) that never reaches the artifact: the wheel
      # contains only cv2/ and opencv_python_headless.libs/, no Python
      # packages. Gating on those produced failures for msgpack vendored inside
      # pip and for the setuptools wheel bundled in python3.12-venv's
      # ensurepip/_bundled/ -- neither installed nor shipped. A gate that is red
      # for things absent from the artifact is one people learn to ignore.
      # Python findings are still reported to code scanning above.
      #
      # ignore-unfixed -- an unfixed upstream CVE is not actionable in this
      # build, and a permanently red gate is an ignored gate.
      - name: Fail on fixable HIGH/CRITICAL in shipped libraries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencv-fips-builder:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          # The action's input is `vuln-type`, not `pkg-types` (upstream has a
          # TODO to rename it); it sets TRIVY_PKG_TYPES. Passing `pkg-types`
          # here is silently ignored -- unknown action inputs do not error --
          # which reads as the filter working while it does nothing.
          vuln-type: os

  collect:
    name: collect wheels
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # attest-build-provenance needs these; the step self-disables on private
      # repos without the entitlement (see `if:` below).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opencv-fips-wheel-*
          path: wheelhouse
          merge-multiple: true

      - name: Summarize
        run: |
          set -euo pipefail
          cat wheelhouse/SHA256SUMS.* > wheelhouse/SHA256SUMS
          {
            echo '### FIPS-safe OpenCV wheels'
            echo
            echo '```'
            cat wheelhouse/SHA256SUMS
            echo '```'
            echo
            echo 'Drop these into custom-wheels/ before building the vLLM image.'
          } >> "$GITHUB_STEP_SUMMARY"

      # SLSA provenance for the wheels. Requires a public repo or a paid plan,
      # so it is skipped rather than failing the run elsewhere.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wheelhouse/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencv-fips-wheels
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to release
    if: github.event_name == 'release'
    # Depends on `scan` as well as `collect`: artifacts are still uploaded by
    # the earlier jobs for triage, but a release is not published with a
    # fixable HIGH/CRITICAL in a library the wheel vendors.
    needs: [collect, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencv-fips-wheels
          path: wheelhouse
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            wheelhouse/*.whl
            wheelhouse/SHA256SUMS
